<app-header [titre]="'tab2.title' | translate" />
<ion-content [scrollY]="false">
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)" [pullMin]="140">
    <ion-refresher-content refreshingSpinner="bubbles" />
  </ion-refresher>

  @if (loadSwiper) {
  <swiper-container #activitySwiper slides-per-view="1" pagination="true" pagination-clickable="true">
    <swiper-slide>
      <app-instant-auroral-activity
        [loading]="loading"
        [solarWind]="solarWindInstant"
        [measureUnit]="measure"
        [kpCurrent]="kpCurrent"
        [nowcastAurora]="nowcastAurora"
        [nowcastLoading]="nowcastLoading"
        [location]="location"
        [updateTime]="updateTime"
        [nowcastStale]="nowcastStale"
      />
    </swiper-slide>
    <swiper-slide>
      <div class="forecast-scroll">
        <app-forecast-auroral-activity
          [loading]="loading"
          [kpForecast27]="kpForecast27days"
          [kpForecast]="kpForecast"
          [solarWind]="solarWind"
          [solarCycle]="solarCycle"
          [measure]="measure"
          [locale]="locale"
          [hourClock]="hourClock"
          [mapLocation]="location"
        />
      </div>
    </swiper-slide>
  </swiper-container>
  }

  <app-toast [toastError]="dataToast" />
</ion-content>
