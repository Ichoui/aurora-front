<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="tab1">
      <div class="tab-animation" aria-hidden="true">
        <ng-lottie width="70px" height="70px" [options]="weatherAnimation" />
      </div>
      <ion-label>{{ 'tab1.title' | translate }}</ion-label>
    </ion-tab-button>

    <ion-tab-button class="main-btn" tab="tab2">
      <span class="icon-aurora" aria-hidden="true"></span>
      <ion-label>{{ 'tab2.title' | translate }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3">
      <div class="tab-animation" aria-hidden="true">
        <ng-lottie width="50px" height="50px" [options]="settingsAnimation" (animationCreated)="setSettingsAnimationSpeed($event)" />
      </div>
      <ion-label>{{ 'tab3.more.title' | translate }}</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
