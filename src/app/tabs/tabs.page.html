<ion-tabs>
  <!-- trick complètement éclaté car lotties ne fonctionnent pas dans ion-tab-bar -->
  <div class="trick-tab-bar">
    <div #left class="tabs tab1">
      @if (lottieConfigWeather) {
      <ng-lottie [options]="lottieConfigWeather" [width]="100 + '%'" [height]="70 + 'px'" [routerLink]="['', 'tabs', 'tab1']"></ng-lottie>
      } @if (activeRoute === 1) {
      <div class="currentview"></div>
      }
    </div>
    <div #right class="tabs tab3">
      @if (lottieConfigSettings) {
      <ng-lottie
        width="100%"
        height="50px"
        (animationCreated)="animationCreated($event)"
        [options]="lottieConfigSettings"
        [routerLink]="['', 'tabs', 'tab3']"
      ></ng-lottie>
      } @if (activeRoute === 3) {
      <div class="currentview"></div>
      }
    </div>
  </div>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="tab1"></ion-tab-button>

    <ion-tab-button class="main-btn" tab="tab2" #auroraLogo>
      <span class="icon-aurora"></span>
      <ion-label>{{ 'tab2.title' | translate }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3"></ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
